# forward the active program's title
set -g set-titles on
set -g set-titles-string '#{pane_title}'

set -g status off
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g focus-events on
setw -g aggressive-resize on

# preserve keys such as Ctrl+Backspace for terminal applications
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',*:extkeys'

# codex recognizes Ctrl+W as backward-word deletion
bind-key -n C-BSpace send-keys C-w
bind-key -n C-h send-keys C-w
