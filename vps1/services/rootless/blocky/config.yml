ports:
  dns: 53

upstreams:
  groups:
    default:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query

customDNS:
  mapping:
    local.strem.io: 100.64.0.2

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/popupads.txt
      - /app/additional_deny.txt
  allowlists:
    ads:
      - https://raw.githubusercontent.com/anudeepND/whitelist/refs/heads/master/domains/whitelist.txt
      - /app/additional_allow.txt
  clientGroupsBlock:
    default:
      - ads

queryLog:
  type: csv
  target: /logs
  logRetentionDays: 7
  flushInterval: 30s
